global_defs {
    router_id haproxy-1
    script_user root
    enable_script_security
}

vrrp_script check_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2
    weight -2
    fall 3
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface ens18
    virtual_router_id 51
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass keepalived_secret
    }

    virtual_ipaddress {
        192.168.20.10/24
    }

    track_script {
        check_haproxy
    }
}
